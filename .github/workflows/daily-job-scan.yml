name: Daily Job Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * *"

jobs:
  job-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job scanner
        run: python app/main.py
